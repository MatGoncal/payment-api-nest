services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: acmepay
      POSTGRES_PASSWORD: acmepay
      POSTGRES_DB: acmepay
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U acmepay']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    profiles: ['full']
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://acmepay:acmepay@postgres:5432/acmepay?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WEBHOOK_SECRET: dev-webhook-secret
      DEMO_PARTNER_API_KEY: demo-partner-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
