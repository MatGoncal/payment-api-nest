services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: acmepay
      POSTGRES_PASSWORD: acmepay
      POSTGRES_DB: acmepay
    ports:
      - '5433:5432'
    volumes:
      # Postgres 18 images expect the mount one level above PGDATA.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U acmepay']
      interval: 5s
      timeout: 5s
      retries: 5

  # Throwaway database for `npm run test:int`. The integration suite truncates
  # every table between tests, so it must never point at the dev instance.
  postgres-test:
    image: postgres:18-alpine
    profiles: ['test']
    environment:
      POSTGRES_USER: acmepay
      POSTGRES_PASSWORD: acmepay
      POSTGRES_DB: acmepay_test
    ports:
      - '5434:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U acmepay -d acmepay_test']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  fake-pix-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: fake_pix
      POSTGRES_PASSWORD: fake_pix
      POSTGRES_DB: fake_pix
    ports:
      - '5435:5432'
    volumes:
      - fake-pix-pg:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fake_pix -d fake_pix']
      interval: 5s
      timeout: 5s
      retries: 5

  fake-pix:
    build:
      context: ../fake-pix-provider
      dockerfile: Dockerfile
    image: fake-pix-provider:local
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '8080:8080'
    environment:
      PORT: 8080
      WEBHOOK_SECRET: dev-webhook-secret
      FAKE_PIX_API_KEY: fake-pix-demo
      DATABASE_URL: postgres://fake_pix:fake_pix@fake-pix-db:5432/fake_pix?sslmode=disable
    depends_on:
      fake-pix-db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/health']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    build: .
    profiles: ['full']
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://acmepay:acmepay@postgres:5432/acmepay?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WEBHOOK_SECRET: dev-webhook-secret
      DEMO_PARTNER_API_KEY: demo-partner-key
      FAKE_PIX_BASE_URL: http://fake-pix:8080
      FAKE_PIX_API_KEY: fake-pix-demo
      FAKE_PIX_CALLBACK_URL: http://api:3001/v1/webhooks/payment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      fake-pix:
        condition: service_healthy

volumes:
  pgdata:
  fake-pix-pg:
