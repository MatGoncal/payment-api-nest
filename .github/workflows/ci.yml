name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: acmepay
          POSTGRES_PASSWORD: acmepay
          POSTGRES_DB: acmepay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acmepay"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://acmepay:acmepay@localhost:5432/acmepay?schema=public
      TEST_DATABASE_URL: postgresql://acmepay:acmepay@localhost:5432/acmepay_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      WEBHOOK_SECRET: dev-webhook-secret
      DEMO_PARTNER_API_KEY: demo-partner-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npx prisma migrate deploy

      - run: npm run db:seed

      - run: npm run lint

      - run: npm test

      # The integration suite truncates every table, so it gets its own database.
      - name: Create integration database
        run: psql "$DATABASE_URL" -c 'CREATE DATABASE acmepay_test'

      - run: npm run test:int

      - run: npm run build
